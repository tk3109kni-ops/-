let currentQuestions = [];

let currentQuestionIndex = 0;

let currentDifficulty = "easy";

let timeLimit = 10;

let remainingTime = 10;

let timer = null;


function hideAllScreens() {

    document.getElementById("start-screen")
        .classList.add("hidden");

    document.getElementById("difficulty-screen")
        .classList.add("hidden");

    document.getElementById("game-screen")
        .classList.add("hidden");

    document.getElementById("result-screen")
        .classList.add("hidden");

}


function showDifficulty() {

    hideAllScreens();

    document.getElementById("difficulty-screen")
        .classList.remove("hidden");

}



function startGame(difficulty) {

currentDifficulty = difficulty;

timeLimit = difficulties[difficulty];



const firstQuestion = questions[0];


const otherQuestions = questions.slice(1);


shuffle(otherQuestions);





currentQuestions = [

    firstQuestion,

    ...otherQuestions.slice(0, 24)

];




currentQuestionIndex = 0;

hideAllScreens();

document.getElementById("game-screen")
    .classList.remove("hidden");

showQuestion();

}


function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];

    }

}


function showQuestion() {

clearInterval(timer);


if (currentQuestionIndex >= currentQuestions.length) {

    gameClear();

    return;
}


const current =
    currentQuestions[currentQuestionIndex];



document.getElementById("question")
    .textContent = current.question;




document.getElementById("progress")
    .textContent =
    `問題 ${currentQuestionIndex + 1} / ${currentQuestions.length}`;


document.getElementById("message")
    .textContent = "";




const characterImage =
    document.getElementById("character-image");


if (current.image) {

    characterImage.src = current.image;

    characterImage.style.display = "block";

} else {

    characterImage.style.display = "none";

}



startTimer();

}



function startTimer() {

    remainingTime = timeLimit;

    updateTimerDisplay();


    const startTime = Date.now();


    timer = setInterval(() => {

        const elapsed =
            (Date.now() - startTime) / 1000;

        remainingTime =
            timeLimit - elapsed;


        if (remainingTime <= 0) {

            remainingTime = 0;

            updateTimerDisplay();

            clearInterval(timer);

            gameOver("時間切れ！最初からやり直しです。");

            return;
        }


        updateTimerDisplay();

    }, 50);

}



function updateTimerDisplay() {

    const text =
        remainingTime.toFixed(1) + "秒";

    document.getElementById("timer-text")
        .textContent = text;


    const percentage =
        (remainingTime / timeLimit) * 100;


    const bar =
        document.getElementById("timer-bar");


    bar.style.width =
        percentage + "%";



    if (percentage <= 30) {

        bar.classList.add("danger");

    } else {

        bar.classList.remove("danger");

    }

}



function answer(playerAnswer) {

clearInterval(timer);

const current =
    currentQuestions[currentQuestionIndex];



if (playerAnswer === current.answer) {

    currentQuestionIndex++;

    showQuestion();

}




else {


    const message =
        current.comment ||
        "残念！答えが違います。";

    gameOver(message);

}

}




function gameOver(message) {

    clearInterval(timer);


    const current =
        currentQuestions[currentQuestionIndex];



    const characterImage =
        document.getElementById("character-image");


    if (current.wrongImage) {

        characterImage.src =
            current.wrongImage;

        characterImage.style.display =
            "block";

    }



    document.getElementById("message")
        .textContent = message;


    

    setTimeout(() => {

        showDifficulty();

    }, 4800);

}



function gameClear() {

    clearInterval(timer);
    const clearImages = {

easy: "syugo.png",

normal: "finish.png",

hard: "gohoubi.png"

};



document.getElementById("clear-image").src =
clearImages[currentDifficulty];

    hideAllScreens();

    document.getElementById("result-screen")
        .classList.remove("hidden");

}
